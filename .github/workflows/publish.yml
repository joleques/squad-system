name: Publish package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install supported npm
        run: npm install --global npm@^11.5.1

      - name: Validate tag and package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          if ! printf '%s\n' "${tag}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Invalid release tag: ${tag}. Expected strict SemVer vX.Y.Z." >&2
            exit 1
          fi
          if [ "${tag}" != "v${version}" ]; then
            echo "Tag ${tag} does not match package version ${version}." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish
